version: 2

project_name: gogo

before:
  hooks:
    - go mod download

builds:
  - id: gogo
    main: ./cmd/gogo
    binary: gogo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/daFish/gogo-meta/internal/version.Version={{.Version}}
      - -X github.com/daFish/gogo-meta/internal/version.BuildDate={{.Date}}
      - -X github.com/daFish/gogo-meta/internal/version.GitCommit={{.FullCommit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: 'checksums.txt'

homebrew_casks:
  - name: gogo
    binaries:
      - gogo
    directory: Casks
    homepage: 'https://github.com/daFish/gogo-meta'
    description: 'Run commands across multiple Git repositories at once'
    # Homebrew 6 deprecated the `postflight` stanza that `hooks.post.install`
    # emits, so the quarantine cleanup is written as `postflight_steps` here
    # until goreleaser can emit it itself (goreleaser/goreleaser#6873).
    # `chdir: "."` resolves to the staged path, which keeps Homebrew's own
    # `{{ }}` tokens out of the goreleaser template.
    custom_block: |
      depends_on macos: :monterey

      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "gogo"], chdir: "."
        end
      end
    commit_author:
      name: 'github-actions[bot]'
      email: '41898282+github-actions[bot]@users.noreply.github.com'
    commit_msg_template: 'chore: brew cask update for {{ .ProjectName }} {{ .Tag }}'
    repository:
      owner: daFish
      name: homebrew-gogo-meta
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'

dockers:
  - image_templates:
      - 'ghcr.io/dafish/gogo-meta:{{ .Version }}-amd64'
      - 'ghcr.io/dafish/gogo-meta:{{ .Major }}.{{ .Minor }}-amd64'
    use: buildx
    goarch: amd64
    dockerfile: Dockerfile
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source=https://github.com/daFish/gogo-meta
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.revision={{.FullCommit}}
  - image_templates:
      - 'ghcr.io/dafish/gogo-meta:{{ .Version }}-arm64'
      - 'ghcr.io/dafish/gogo-meta:{{ .Major }}.{{ .Minor }}-arm64'
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.source=https://github.com/daFish/gogo-meta
      - --label=org.opencontainers.image.version={{.Version}}
      - --label=org.opencontainers.image.revision={{.FullCommit}}

docker_manifests:
  - name_template: 'ghcr.io/dafish/gogo-meta:{{ .Version }}'
    image_templates:
      - 'ghcr.io/dafish/gogo-meta:{{ .Version }}-amd64'
      - 'ghcr.io/dafish/gogo-meta:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/dafish/gogo-meta:{{ .Major }}.{{ .Minor }}'
    image_templates:
      - 'ghcr.io/dafish/gogo-meta:{{ .Major }}.{{ .Minor }}-amd64'
      - 'ghcr.io/dafish/gogo-meta:{{ .Major }}.{{ .Minor }}-arm64'
  - name_template: 'ghcr.io/dafish/gogo-meta:latest'
    image_templates:
      - 'ghcr.io/dafish/gogo-meta:{{ .Version }}-amd64'
      - 'ghcr.io/dafish/gogo-meta:{{ .Version }}-arm64'

release:
  # release-please creates the release as a draft and force-creates the tag.
  # GoReleaser adopts that draft, uploads the artifacts and publishes it last.
  # GitHub seals an immutable release the moment it is published, so assets
  # must be attached while it is still a draft.
  use_existing_draft: true
  # The draft is matched by release name, which must equal the tag.
  name_template: '{{ .Tag }}'
  mode: append
  # A failed run leaves a mutable draft, so the job can be re-run; without
  # this, re-uploading an artifact that made it through the first time 422s.
  replace_existing_artifacts: true
  preflight:
    fail_on_error: true
